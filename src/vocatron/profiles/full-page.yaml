# A full page of lines at once, in the middle of the screen: the sung lines stay until the whole
# page clears, then the next page appears (the page of a classic disc, ADR-0009).
name: full-page
description: A page of up to five lines that clears as a whole; sung lines stay until then.
mode: page
slots: 5
page: {min_lines: 3}
align: center
position: middle
safe_area: 0.9
font:
  family: bundled-sans-bold
  size: 0.10
  min_size: 0.07
  case: as-written
background: "#000000"
colours:
  singer1: {unsung: "#ffffff", sung: "#3399ff", edge: "#000000"}
  singer2: {unsung: "#ffffff", sung: "#ff3399", edge: "#000000"}
  singer3: {unsung: "#ffffff", sung: "#33cc66", edge: "#000000"}
  singer4: {unsung: "#ffffff", sung: "#ff9933", edge: "#000000"}
  singer5: {unsung: "#ffffff", sung: "#cc99dd", edge: "#000000"}
  group: {unsung: "#ffffff", sung: "#ffcc00", edge: "#000000"}
edge: {width: 0.08}
shadow: {offset: 0.04, colour: "#000000", alpha: 0.6}
wipe: {granularity: smooth, offset: 0.0}
lead_in: {min: 1.0, target: 2.5, max: 4.0}
clear: {hold: 1.1, replace_after: 0.33}
breaks: {clear_after: 5.0, notice_after: 15.0, notice: Instrumental, show_title: false}
countdown: {min_gap: 5.0, duration: 1.8, form: dots, count: 3}
title: {min: 6.0, min_short: 4.0, fields: [title, artist, singers]}
intro: {solo: 8.0, group: 9.0}
ending: {end_screen: true, start_after: 2.0, fade: 0.5}
# On CD+G (ADR-0029): sizes in pixels on the 192 px safe area; colours are rounded to 12 bits, the
# shadow and the fade are dropped.
cdg: {made_for_cdg: true, slots: 5, font_px: 20, min_font_px: 18, edge_px: 1, wipe_columns: 3}
