# Publishes the documentation site to GitHub Pages from main. It does nothing while the repository
# is private: both jobs are skipped unless github.event.repository.private is false. When the
# repository is made public, enable Pages (Settings > Pages > Source: GitHub Actions) once.
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event.repository.private == false
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: make env UV=uv TORCH_EXTRA=cpu
      - run: make docs UV=uv
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    needs: build
    if: github.event.repository.private == false
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
